# Streamlit-Konfiguration der TB-Validierungs-GUI (Vorführung).
# Wird gelesen, wenn die App im Ordner gui gestartet wird:
#     python -m streamlit run app.py

[server]
headless = true              # kein automatisches Öffnen eines Browsers
address = "127.0.0.1"        # nur lokal erreichbar (Adresse steht in der Konsole)
runOnSave = false
fileWatcherType = "none"     # keine Dateiüberwachung (Ordner liegt in Google Drive)
enableStaticServing = true   # Ordner ./static unter /app/static (Schrift Roboto, lokal)

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"      # keine Entwickler-Menüs für das Publikum
showErrorDetails = "none"    # keine Tracebacks im Browser (nur in der Konsole)

[runner]
magicEnabled = false

[theme]
base = "light"
primaryColor = "#00539F"     # DAV-Blau
backgroundColor = "#F3F5F8"  # Seitengrund sehr hell grau, Flächen weiß (app.py)
secondaryBackgroundColor = "#E9EDF2"
textColor = "#1A2433"
borderColor = "#D5DCE5"
baseRadius = "none"          # keine abgerundeten Ecken (Rest per CSS in app.py)
buttonRadius = "none"
# Grundschrift 16 px; app.py setzt 16 px × Faktor (Seitenleiste). Größer für
# die Leinwand: Browser-Zoom (Strg +).
baseFontSize = 16
# Roboto lokal (static/fonts, OFL-Lizenz), variable Schrift für alle
# Strichstärken; Unicode-Bereiche wie bei Google Fonts.
font = "Roboto, Segoe UI, system-ui, sans-serif"

[[theme.fontFaces]]
family = "Roboto"
url = "app/static/fonts/roboto-latin.woff2"
weight = "100 900"
style = "normal"
unicodeRange = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"

[[theme.fontFaces]]
family = "Roboto"
url = "app/static/fonts/roboto-latin-ext.woff2"
weight = "100 900"
style = "normal"
unicodeRange = "U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF"

[[theme.fontFaces]]
family = "Roboto"
url = "app/static/fonts/roboto-greek.woff2"
weight = "100 900"
style = "normal"
unicodeRange = "U+0370-03FF"
